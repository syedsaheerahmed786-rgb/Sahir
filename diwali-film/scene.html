<!doctype html>
<html><head><meta charset="utf-8">
<title>Diwali Film</title>
<style>
@font-face{font-family:'Tiro';src:url(fonts/TiroDevanagariHindi.ttf) format('truetype');font-weight:400}
@font-face{font-family:'NSD';src:url(fonts/NotoSerifDevanagari-Regular.ttf) format('truetype');font-weight:400}
@font-face{font-family:'NSD';src:url(fonts/NotoSerifDevanagari-SemiBold.ttf) format('truetype');font-weight:600}
@font-face{font-family:'Corm';src:url(fonts/CormorantGaramond-Italic.ttf) format('truetype');font-style:italic;font-weight:400}
@font-face{font-family:'Corm';src:url(fonts/CormorantGaramond-SemiBold.ttf) format('truetype');font-style:normal;font-weight:600}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}

<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
const W=1920,H=1080,DURATION=40.0;          /* design space the stage is laid out in */
const REEL=new URLSearchParams(location.search).has('reel');
const VW=REEL?1080:1920, VH=REEL?1920:1080;  /* output pixels */
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
cv.width=VW; cv.height=VH;
/* how far the camera may roam outside the design frame (the reel sees more sky and ground) */
const FIELD={x0:-260,x1:2180,y0:-760,y1:1460};
let CAM={cx:W/2,cy:H/2,z:1};
function worldRect(){
  const hw=VW/(2*CAM.z), hh=VH/(2*CAM.z);
  return {x0:CAM.cx-hw,y0:CAM.cy-hh,x1:CAM.cx+hw,y1:CAM.cy+hh,w:hw*2,h:hh*2};
}

/* ---------------- math / util ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a=0,b=1)=>v<a?a:(v>b?b:v);
const lerp=(a,b,p)=>a+(b-a)*p;
const smooth=p=>{p=clamp(p);return p*p*(3-2*p)};
const eOut=p=>1-Math.pow(1-clamp(p),3);
const eOut2=p=>1-Math.pow(1-clamp(p),2);
const eIn=p=>{p=clamp(p);return p*p};
/* fade window: 0 outside [t0,t1], 1 in the middle */
function win(t,t0,t1,fi=0.6,fo=0.6){if(t<=t0||t>=t1)return 0;return Math.min(smooth((t-t0)/fi),smooth((t1-t)/fo));}
function fadeIn(t,t0,d){return smooth((t-t0)/d);}

/* ---------------- sprites (pre-rendered for speed) ---------------- */
function spriteCanvas(size,paint){const c=document.createElement('canvas');c.width=c.height=size;paint(c.getContext('2d'),size);return c;}
/* soft radial glow, warm */
function makeGlow(stops,size=256,pow=1){
  return spriteCanvas(size,(g,s)=>{
    const r=s/2, grd=g.createRadialGradient(r,r,0,r,r,r);
    for(const [p,c] of stops) grd.addColorStop(p,c);
    g.fillStyle=grd; g.beginPath(); g.arc(r,r,r,0,7); g.fill();
  });
}
const GLOW_WARM=makeGlow([[0,'rgba(255,214,150,1)'],[0.12,'rgba(255,176,86,0.78)'],[0.32,'rgba(242,126,38,0.30)'],[0.62,'rgba(170,70,20,0.09)'],[1,'rgba(120,40,10,0)']]);
const GLOW_CORE=makeGlow([[0,'rgba(255,255,240,1)'],[0.25,'rgba(255,230,170,0.6)'],[1,'rgba(255,180,90,0)']],128);
const GLOW_GOLD=makeGlow([[0,'rgba(255,236,196,0.95)'],[0.3,'rgba(246,198,110,0.42)'],[1,'rgba(200,140,50,0)']]);
const GLOW_ROSE=makeGlow([[0,'rgba(255,224,230,0.95)'],[0.3,'rgba(232,96,122,0.40)'],[1,'rgba(150,30,60,0)']]);
const GLOW_COOL=makeGlow([[0,'rgba(200,220,255,0.75)'],[0.35,'rgba(120,150,220,0.22)'],[1,'rgba(60,80,160,0)']]);
function glow(x,y,r,a,sp){if(a<=0.004)return;ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(sp||GLOW_WARM,x-r,y-r,r*2,r*2);ctx.restore();}

/* film grain tiles */
const GRAIN=[];
(function(){for(let k=0;k<6;k++){const r=mulberry32(900+k*37);GRAIN.push(spriteCanvas(256,(g,s)=>{
  const img=g.createImageData(s,s);for(let i=0;i<s*s;i++){const v=180+(r()*150-75);img.data[i*4]=v;img.data[i*4+1]=v;img.data[i*4+2]=v;img.data[i*4+3]=255;}g.putImageData(img,0,0);}));}})();

/* ---------------- stars ---------------- */
const STARS=(()=>{const r=mulberry32(7);const a=[];
  for(let i=0;i<300;i++){a.push({x:r()*W,y:r()*700,s:0.35+r()*1.5,p:r()*7,sp:0.5+r()*2.2,w:0.3+r()*0.7});}
  for(let i=0;i<260;i++){a.push({x:FIELD.x0+r()*(FIELD.x1-FIELD.x0),y:FIELD.y0+r()*(760-FIELD.y0),s:0.35+r()*1.5,p:r()*7,sp:0.5+r()*2.2,w:0.3+r()*0.7});}
  return a;})();
function drawSky(t,warm,zoom){
  const wr=worldRect();
  /* stops stay pinned to design-space y so the horizon glow lands on the horizon */
  const gy0=FIELD.y0, gy1=H, sp=v=>(v*H-gy0)/(gy1-gy0);
  const g=ctx.createLinearGradient(0,gy0,W*0.18,gy1);
  g.addColorStop(0,'#03040a');
  g.addColorStop(sp(0),'#04050c'); g.addColorStop(sp(0.30),'#070a16');
  g.addColorStop(sp(0.52),`rgb(${(11+warm*22)|0},${(13+warm*10)|0},${(30+warm*8)|0})`);
  g.addColorStop(sp(0.72),`rgb(${(22+warm*52)|0},${(18+warm*22)|0},${(34+warm*6)|0})`);
  g.addColorStop(1,`rgb(${(12+warm*34)|0},${(10+warm*14)|0},${(20+warm*6)|0})`);
  ctx.fillStyle=g; ctx.fillRect(wr.x0,wr.y0,wr.w,wr.h);
  /* milky haze */
  const hz=ctx.createRadialGradient(W*0.30,H*0.18,0,W*0.30,H*0.18,W*0.55);
  hz.addColorStop(0,'rgba(90,110,180,0.10)'); hz.addColorStop(1,'rgba(90,110,180,0)');
  ctx.fillStyle=hz; ctx.fillRect(wr.x0,wr.y0,wr.w,wr.h);
  /* stars */
  ctx.save();
  for(const s of STARS){
    const tw=0.45+0.55*Math.sin(t*s.sp+s.p);
    const a=s.w*tw*(1-warm*0.45)*clamp(1-(s.y/760),0,1);
    if(a<=0.02)continue;
    ctx.globalAlpha=a; ctx.fillStyle='#e8eeff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,7); ctx.fill();
    if(s.s>1.25){ctx.globalAlpha=a*0.5;ctx.drawImage(GLOW_COOL,s.x-9,s.y-9,18,18);}
  }
  ctx.restore();
}

/* ---------------- camera ---------------- */
function applyCam(cx,cy,zoom){
  const hw=VW/(2*zoom), hh=VH/(2*zoom);
  if(REEL){ cx=clamp(cx,FIELD.x0+hw,FIELD.x1-hw); cy=clamp(cy,FIELD.y0+hh,FIELD.y1-hh); }
  else { cx=clamp(cx,hw,W-hw); cy=clamp(cy,hh,H-hh); }
  CAM={cx,cy,z:zoom};
  ctx.translate(VW/2,VH/2); ctx.scale(zoom,zoom); ctx.translate(-cx,-cy);
}

/* ---------------- diya ---------------- */
/* s = half-width of the bowl in px. lit 0..1 drives flame + glow */
function drawDiya(x,y,s,lit,seed,t,opt){
  opt=opt||{};
  const fl=0.78+0.22*Math.sin(t*9.1+seed*5.1)+0.10*Math.sin(t*23.7+seed*2.3)+0.05*Math.sin(t*41.3+seed);
  const L=clamp(lit);
  if(L>0.01){
    glow(x,y-s*0.55,s*(5.2+fl*0.7)*(opt.glowR||1),0.40*L*(opt.glowA||1),GLOW_WARM);
    glow(x,y-s*0.55,s*1.7,0.55*L,GLOW_CORE);
  }
  /* bowl */
  const bw=s, bh=s*0.52;
  const bg=ctx.createLinearGradient(x-bw,y-bh*0.6,x+bw*0.7,y+bh*1.4);
  bg.addColorStop(0,`rgb(${(96+L*78)|0},${(50+L*34)|0},${(34+L*12)|0})`);
  bg.addColorStop(0.45,`rgb(${(70+L*52)|0},${(34+L*22)|0},${(24+L*8)|0})`);
  bg.addColorStop(1,`rgb(${(30+L*18)|0},${(15+L*8)|0},${(12+L*4)|0})`);
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(x-bw,y-bh*0.30);
  ctx.bezierCurveTo(x-bw*0.95,y+bh*1.15, x+bw*0.95,y+bh*1.15, x+bw,y-bh*0.30);
  ctx.bezierCurveTo(x+bw*0.55,y+bh*0.12, x-bw*0.55,y+bh*0.12, x-bw,y-bh*0.30);
  ctx.closePath(); ctx.fill();
  /* rim */
  ctx.strokeStyle=`rgba(${(255)|0},${(190+L*40)|0},${(120+L*60)|0},${0.10+0.42*L})`;
  ctx.lineWidth=Math.max(1,s*0.055);
  ctx.beginPath(); ctx.ellipse(x,y-bh*0.30,bw,bh*0.30,0,0,Math.PI*2); ctx.stroke();
  /* oil / inner shadow */
  ctx.fillStyle=`rgba(${(60+L*120)|0},${(32+L*70)|0},${(16+L*20)|0},${0.55+0.3*L})`;
  ctx.beginPath(); ctx.ellipse(x,y-bh*0.30,bw*0.88,bh*0.255,0,0,Math.PI*2); ctx.fill();
  if(L>0.02){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.5*L;
    ctx.fillStyle='rgba(255,170,80,0.9)';
    ctx.beginPath(); ctx.ellipse(x+s*0.05,y-bh*0.26,bw*0.46,bh*0.15,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  /* wick + flame */
  const wx=x+s*0.0, wy=y-bh*0.42;
  ctx.fillStyle='#2a1a14';
  ctx.beginPath(); ctx.ellipse(wx,wy,s*0.10,s*0.07,0,0,Math.PI*2); ctx.fill();
  if(L>0.015){
    const fh=s*1.28*L*(0.92+fl*0.12)*(opt.flame||1);
    const fw=s*0.30*(0.9+fl*0.14);
    const sway=Math.sin(t*5.3+seed*3.1)*s*0.055+Math.sin(t*11.9+seed)*s*0.022;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    /* outer flame */
    const og=ctx.createLinearGradient(wx,wy-fh,wx,wy+fh*0.18);
    og.addColorStop(0,'rgba(255,214,120,0.00)');
    og.addColorStop(0.22,'rgba(255,170,60,0.42)');
    og.addColorStop(0.62,'rgba(255,120,30,0.52)');
    og.addColorStop(1,'rgba(200,60,10,0.22)');
    ctx.fillStyle=og;
    ctx.beginPath();
    ctx.moveTo(wx+sway,wy-fh);
    ctx.bezierCurveTo(wx+fw*1.5+sway*0.5,wy-fh*0.44, wx+fw*1.15,wy-fh*0.02, wx,wy+fh*0.06);
    ctx.bezierCurveTo(wx-fw*1.15,wy-fh*0.02, wx-fw*1.5+sway*0.5,wy-fh*0.44, wx+sway,wy-fh);
    ctx.closePath(); ctx.fill();
    /* inner core */
    const ig=ctx.createLinearGradient(wx,wy-fh*0.62,wx,wy+fh*0.06);
    ig.addColorStop(0,'rgba(255,248,214,0.95)');
    ig.addColorStop(0.5,'rgba(255,226,150,0.92)');
    ig.addColorStop(1,'rgba(255,150,40,0.55)');
    ctx.fillStyle=ig;
    ctx.beginPath();
    ctx.moveTo(wx+sway*0.6,wy-fh*0.66);
    ctx.bezierCurveTo(wx+fw*0.80,wy-fh*0.28, wx+fw*0.62,wy-fh*0.01, wx,wy+fh*0.03);
    ctx.bezierCurveTo(wx-fw*0.62,wy-fh*0.01, wx-fw*0.80,wy-fh*0.28, wx+sway*0.6,wy-fh*0.66);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* ---------------- fireworks (analytic, deterministic) ---------------- */
const FW_KINDS=['peony','willow','crackle'];
function makeFireworks(){
  const r=mulberry32(4242), out=[];
  /* scene 4 climb + climax: 22.4 .. 30.6 ; finale 29.8 .. 39.6 */
  function add(t0,x,y,kind,pal,sc,n){out.push({t0,x,y,kind,pal,sc,n,seed:r()*1000});}
  const pals=['gold','rose','gold','warm','gold','rose'];
  let t=22.6;
  while(t<30.4){
    const x=lerp(320,1620,r()), y=lerp(110,400,r());
    add(t,x,y,FW_KINDS[(r()*3)|0],pals[(r()*pals.length)|0],0.8+r()*0.55,42+((r()*34)|0));
    t+= (t>25.0&&t<28.2)? (0.26+r()*0.34) : (0.55+r()*0.6);
  }
  /* the big one, on the embrace */
  add(26.05,980,205,'peony','gold',1.95,150);
  add(26.3,1330,300,'peony','rose',1.25,80);
  add(26.5,640,255,'willow','gold',1.45,95);
  t=30.0;
  while(t<39.4){
    const x=lerp(290,1650,r()), y=lerp(95,410,r());
    add(t,x,y,FW_KINDS[(r()*3)|0],pals[(r()*pals.length)|0],0.85+r()*0.7,45+((r()*40)|0));
    t+=0.34+r()*0.5;
  }
  add(31.4,960,200,'peony','gold',2.0,160);
  add(34.8,1500,250,'willow','rose',1.5,100);
  add(37.0,420,230,'peony','gold',1.6,120);
  return out;
}
const FIREWORKS=makeFireworks();
const PAL={
  gold:[[255,238,190],[255,200,110],[255,158,54],[240,120,30]],
  rose:[[255,226,232],[255,150,175],[232,92,120],[190,40,70]],
  warm:[[255,246,225],[255,214,150],[255,170,90],[230,110,40]]
};
function fwDraw(t,intensity){
  if(intensity<=0.01)return;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  for(const f of FIREWORKS){
    const age=t-f.t0;
    const life=f.kind==='willow'?2.7:(f.kind==='crackle'?1.0:2.0);
    if(age<-0.9||age>life)continue;
    /* rising rocket */
    if(age<0){
      const p=1+age/0.9; /* 0..1 */
      const y0=1080, yy=lerp(y0,f.y,eOut2(p));
      ctx.globalAlpha=0.5*intensity*(0.35+0.65*p);
      ctx.strokeStyle='rgba(255,196,120,0.9)'; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.moveTo(f.x,yy+34); ctx.lineTo(f.x,yy); ctx.stroke();
      ctx.globalAlpha=0.6*intensity;
      ctx.drawImage(GLOW_GOLD,f.x-16,yy-16,32,32);
      continue;
    }
    const pal=PAL[f.pal]||PAL.gold;
    const r=mulberry32(f.seed|0);
    const tau=f.kind==='willow'?0.9:0.55, G=f.kind==='willow'?150:95;
    const base=240*f.sc;
    /* flash */
    if(age<0.26){
      const a=(1-age/0.26);
      glow(f.x,f.y,base*0.34*(0.18+age*3.0),0.50*a*a*intensity,GLOW_CORE);
    }
    const decay=Math.exp(-age/(life*0.27));
    const n=f.n;
    for(let i=0;i<n;i++){
      const ang=(i/n)*Math.PI*2+r()*0.22;
      const spd=base*(0.40+r()*0.66);
      const wind=(r()-0.5)*26;
      let vx=Math.cos(ang)*spd, vy=Math.sin(ang)*spd;
      const dd=tau*(1-Math.exp(-age/tau));
      const px=f.x+vx*dd+wind*age*age, py=f.y+vy*dd+0.5*G*age*age;
      const ddp=tau*(1-Math.exp(-Math.max(0,age-0.062)/tau));
      const ag2=Math.max(0,age-0.062);
      const qx=f.x+vx*ddp+wind*ag2*ag2, qy=f.y+vy*ddp+0.5*G*ag2*ag2;
      const ci=Math.min(3,(age/life*3.4+r()*0.5)|0);
      const c=pal[ci];
      const tw=f.kind==='crackle'?(0.3+0.7*Math.abs(Math.sin(age*58+i))):1;
      const a=decay*tw*intensity*(0.85+0.15*Math.sin(i*2.3));
      if(a<0.02)continue;
      ctx.globalAlpha=clamp(a,0,1);
      ctx.strokeStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
      ctx.lineWidth=(f.kind==='willow'?2.4:3.0)*f.sc*(0.55+0.6*decay);
      ctx.beginPath(); ctx.moveTo(qx,qy); ctx.lineTo(px,py); ctx.stroke();
      if(i%7===0&&a>0.25){ctx.globalAlpha=a*0.33;ctx.drawImage(f.pal==='rose'?GLOW_ROSE:GLOW_GOLD,px-13,py-13,26,26);}
    }
    /* ambient sky wash from the burst */
    glow(f.x,f.y,base*2.6,0.10*decay*intensity,f.pal==='rose'?GLOW_ROSE:GLOW_GOLD);
  }
  ctx.restore();
}
window.__part1=true;
</script>
<script>
"use strict";
/* ---------------- stage layout ---------------- */
const LY={
  horizon:640, ground:800,
  house:{x0:980,x1:1575,top:418,base:800},
  door:{x0:1215,x1:1332,top:596,base:800},
  w1:{x0:1032,x1:1142,y0:502,y1:588},
  w2:{x0:1418,x1:1528,y0:502,y1:588},
  w3:{x0:1243,x1:1308,y0:452,y1:498},
  wall:{x0:-30,x1:978,top:712,base:802},
  rang:{cx:688,cy:918,rx:300,ry:128}
};

/* ---- distant town ---- */
const TOWN=(()=>{const r=mulberry32(31);const a=[];let x=-40;
  while(x<2200){const w=24+r()*78,h=12+r()*54;a.push({x,w,h,lights:[]});
    const n=(r()*3)|0;for(let i=0;i<n;i++)a[a.length-1].lights.push({dx:4+r()*(w-9),dy:4+r()*(h-8),p:r()*7,sp:0.4+r()*1.4});
    x+=w+r()*18;}
  return a;})();
function drawTown(t,amt){
  if(amt<=0.01)return;
  const y=LY.horizon;
  ctx.save();
  ctx.fillStyle='#07070f';
  for(const b of TOWN){ctx.fillRect(b.x,y-b.h,b.w,b.h+8);}
  ctx.globalCompositeOperation='lighter';
  for(const b of TOWN){for(const l of b.lights){
    const a=amt*(0.35+0.45*(0.5+0.5*Math.sin(t*l.sp+l.p)));
    ctx.globalAlpha=a; ctx.fillStyle='#ffc368';
    ctx.fillRect(b.x+l.dx,y-b.h+l.dy,2.3,2.3);
    ctx.globalAlpha=a*0.55; ctx.drawImage(GLOW_WARM,b.x+l.dx-9,y-b.h+l.dy-9,18,18);
  }}
  ctx.restore();
  /* haze over the town */
  const g=ctx.createLinearGradient(0,y-70,0,y+30);
  g.addColorStop(0,'rgba(60,48,70,0)'); g.addColorStop(1,`rgba(${90+amt*40|0},${60+amt*20|0},${70},${0.22+amt*0.18})`);
  const wr=worldRect();
  ctx.fillStyle=g; ctx.fillRect(wr.x0,y-70,wr.w,100);
}

/* ---- rangoli sprite ---- */
const RANG=spriteCanvas(840,(g,s)=>{
  const c=s/2;
  g.translate(c,c);
  function petal(R,len,wid,col,a){
    g.fillStyle=col; g.globalAlpha=a;
    g.beginPath();
    g.moveTo(R,0);
    g.bezierCurveTo(R+len*0.45,-wid, R+len*0.85,-wid*0.55, R+len,0);
    g.bezierCurveTo(R+len*0.85,wid*0.55, R+len*0.45,wid, R,0);
    g.closePath(); g.fill();
  }
  function ring(n,R,len,wid,col,a,rot){
    for(let i=0;i<n;i++){g.save();g.rotate(rot+i/n*Math.PI*2);petal(R,len,wid,col,a);g.restore();}
  }
  ring(20,232,172,30,'#B31237',0.95,0);
  ring(20,214,54,16,'#F6D98B',0.8,Math.PI/20);
  ring(16,158,78,26,'#B07A12',0.95,Math.PI/16);
  ring(12,104,58,24,'#2E7D4F',0.92,0);
  ring(12,86,24,10,'#F2EFEB',0.75,Math.PI/12);
  ring(8,44,46,20,'#B31237',0.9,Math.PI/8);
  g.globalAlpha=1;
  g.fillStyle='#F6D98B'; g.beginPath(); g.arc(0,0,40,0,7); g.fill();
  g.fillStyle='#B31237'; g.beginPath(); g.arc(0,0,24,0,7); g.fill();
  g.fillStyle='#FDF4E3'; g.beginPath(); g.arc(0,0,9,0,7); g.fill();
  /* dotted outer circle */
  g.globalAlpha=0.9;
  for(let i=0;i<48;i++){const a=i/48*Math.PI*2,R=398;g.fillStyle=i%2?'#F6D98B':'#B31237';
    g.beginPath();g.arc(Math.cos(a)*R,Math.sin(a)*R,6.5,0,7);g.fill();}
  for(let i=0;i<32;i++){const a=i/32*Math.PI*2+0.1,R=364;g.fillStyle='#F2EFEB';g.globalAlpha=0.55;
    g.beginPath();g.arc(Math.cos(a)*R,Math.sin(a)*R,3.4,0,7);g.fill();}
});
function drawRangoli(t,p){
  if(p<=0.01)return;
  const R=LY.rang;
  const sc=lerp(0.84,1,eOut(p));
  ctx.save();

    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,R.rx*1.5,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p*1.06),false);
    ctx.closePath(); ctx.clip();
  }
  ctx.globalAlpha=clamp(p*1.4);
  const d=R.rx*1.06*sc;
  ctx.drawImage(RANG,-d,-d,d*2,d*2);
  ctx.restore();
  /* soft light on the powder */
  glow(R.cx,R.cy,R.rx*1.25,0.10*p,GLOW_WARM);
}

/* ---- marigold petals ---- */
const FW_=FIELD.x1-FIELD.x0, FH_=FIELD.y1-FIELD.y0;
const PETALS=(()=>{const r=mulberry32(88);const a=[];for(let i=0;i<96;i++)a.push({x:FIELD.x0+r()*FW_,y0:r()*FH_,sp:22+r()*44,sw:0.5+r()*1.6,ph:r()*7,s:4+r()*7,hue:r(),rot:r()*7,rs:(r()-0.5)*2.4});return a;})();
function drawPetals(t,amt){

    ctx.fillStyle=p.hue>0.5?'#E8912A':'#D9641C';
    ctx.save(); ctx.translate(x,y); ctx.rotate(p.rot+t*p.rs);
    ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*0.52,0,0,7); ctx.fill();
    ctx.globalAlpha*=0.55; ctx.fillStyle='#F6C460';
    ctx.beginPath(); ctx.ellipse(0,-p.s*0.12,p.s*0.6,p.s*0.26,0,0,7); ctx.fill();
    ctx.restore();

/* ---- floating embers / bokeh ---- */
const EMBERS=(()=>{const r=mulberry32(5150);const a=[];for(let i=0;i<165;i++)a.push({x:FIELD.x0+r()*FW_,y0:r()*FH_,sp:12+r()*40,sw:0.4+r()*1.5,ph:r()*7,s:1.1+r()*2.9,tw:0.6+r()*2.4});return a;})();
function drawEmbers(t,amt,yTop){
  if(amt<=0.01)return;

  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const e of EMBERS){

}

/* ---------------- figures ---------------- */
function figurePath(x,y,h,kind,ph,opt){
  opt=opt||{};
  const P=new Path2D();
  const hd=h*0.056, shY=y-h*0.835, hipY=y-h*0.495;
  const shW=h*(kind==='woman'?0.098:0.122), hipW=h*(kind==='woman'?0.074:0.084);
  const bob=Math.sin(ph*2)*h*0.006;
  const Y=v=>v+bob;
  /* head */
  P.moveTo(x+hd,Y(y-h*0.915));
  P.ellipse(x,Y(y-h*0.915),hd,hd*1.12,0,0,Math.PI*2);
  if(kind==='woman'){ /* bun */
    P.moveTo(x-hd*0.2,Y(y-h*0.905));
    P.ellipse(x-hd*1.05,Y(y-h*0.895),hd*0.52,hd*0.52,0,0,Math.PI*2);
  }
  /* neck + torso */
  P.moveTo(x-h*0.016,Y(y-h*0.875));
  P.lineTo(x+h*0.016,Y(y-h*0.875));
  P.lineTo(x+shW,Y(shY));
  P.bezierCurveTo(x+shW*0.96,Y(shY+h*0.12), x+hipW*1.1,Y(hipY-h*0.06), x+hipW,Y(hipY));
  P.lineTo(x-hipW,Y(hipY));
  P.bezierCurveTo(x-hipW*1.1,Y(hipY-h*0.06), x-shW*0.96,Y(shY+h*0.12), x-shW,Y(shY));
  P.closePath();
  /* legs / skirt */
  if(kind==='woman'){
    const ankle=y-h*0.012, flare=h*0.125;
    P.moveTo(x-hipW*1.02,Y(hipY+h*0.01));
    P.bezierCurveTo(x-hipW*1.2,Y(hipY+h*0.2), x-flare*0.95,Y(ankle-h*0.1), x-flare,Y(ankle));
    P.bezierCurveTo(x-flare*0.4,Y(ankle+h*0.022), x+flare*0.4,Y(ankle+h*0.022), x+flare,Y(ankle));
    P.bezierCurveTo(x+flare*0.95,Y(ankle-h*0.1), x+hipW*1.2,Y(hipY+h*0.2), x+hipW*1.02,Y(hipY+h*0.01));
    P.closePath();
  }else{
    const sw=(opt.walk||0)*0.34;
    /* kurta hem */
    P.moveTo(x-hipW*1.04,Y(hipY-h*0.03));
    P.lineTo(x+hipW*1.04,Y(hipY-h*0.03));
    P.lineTo(x+hipW*1.30,Y(hipY+h*0.095));
    P.lineTo(x-hipW*1.30,Y(hipY+h*0.095));
    P.closePath();
    for(const side of [-1,1]){
      const a=sw*side, kx=x+side*hipW*0.52+Math.sin(a)*h*0.17, ky=hipY+h*0.25;
      const fx=kx+Math.sin(a*0.5)*h*0.12, fy=y-h*0.008;
      const lw=h*0.052, lw2=h*0.034;
      P.moveTo(x+side*hipW*0.94,Y(hipY-h*0.02));
      P.lineTo(kx+lw,Y(ky)); P.lineTo(fx+lw2,Y(fy)); P.lineTo(fx-lw2*1.1,Y(fy));
      P.lineTo(kx-lw*0.95,Y(ky)); P.lineTo(x+side*hipW*0.08,Y(hipY-h*0.02));
      P.closePath();
      /* foot */
      P.moveTo(fx-lw2*1.1,Y(fy));
      P.lineTo(fx+lw2*(side>0?2.4:1.6),Y(fy));
      P.lineTo(fx+lw2*(side>0?2.4:1.6),Y(fy+h*0.016));
      P.lineTo(fx-lw2*1.4,Y(fy+h*0.016)); P.closePath();
    }
  }
  /* arms */
  const armsw=(opt.walk||0)*0.30;
  for(const side of [-1,1]){
    const a=opt.reach!==undefined? (side===opt.reachSide? opt.reach : -armsw*side) : -armsw*side;
    const ex=x+side*shW*0.98+Math.sin(a)*h*0.14+ (side===opt.reachSide?Math.cos(a)*h*0.02:0);
    const ey=shY+h*0.135+Math.cos(a)*h*0.03;
    let hx=ex+Math.sin(a*1.9)*h*0.14, hy=ey+h*0.15-Math.abs(Math.sin(a))*h*0.05;
    if(side===opt.reachSide&&opt.reachUp){hx=x+side*shW*2.0;hy=shY-h*0.02;}
    const w1=h*0.040,w2=h*0.029;
    P.moveTo(x+side*shW*0.86,Y(shY+h*0.012));
    P.lineTo(ex+w1*side,Y(ey)); P.lineTo(hx+w2*side,Y(hy)); P.lineTo(hx-w2*side,Y(hy));
    P.lineTo(ex-w1*side*1.1,Y(ey)); P.lineTo(x+side*shW*0.22,Y(shY+h*0.03));
    P.closePath();
    if(opt.bag&&side===1){
      const bw=h*0.088,bh=h*0.108, by=hy+h*0.020;
      P.moveTo(hx-bw,Y(by)); P.lineTo(hx+bw,Y(by));
      P.lineTo(hx+bw*0.94,Y(by+bh)); P.lineTo(hx-bw*0.94,Y(by+bh)); P.closePath();
      P.moveTo(hx-bw*0.36,Y(by)); P.lineTo(hx-bw*0.26,Y(by-h*0.026));
      P.lineTo(hx+bw*0.26,Y(by-h*0.026)); P.lineTo(hx+bw*0.36,Y(by));
      P.closePath();
    }
  }
  /* dupatta */
  if(kind==='woman'&&opt.dupatta!==false){
    const t2=opt.t||0;
    const sx=x-shW*0.9, sy=shY+h*0.02;
    P.moveTo(sx,Y(sy));
    P.bezierCurveTo(x-shW*2.0-Math.sin(t2*2.1)*h*0.07,Y(sy+h*0.12),
                    x-shW*2.6-Math.sin(t2*1.7)*h*0.10,Y(sy+h*0.34),
                    x-shW*2.1-Math.sin(t2*2.4)*h*0.12,Y(sy+h*0.50));
    P.bezierCurveTo(x-shW*1.2,Y(sy+h*0.40), x-shW*1.05,Y(sy+h*0.2), x+shW*0.1,Y(sy+h*0.06));
    P.closePath();
  }
  return P;
}
function contactShadow(x,y,rx,a){
  ctx.save(); ctx.filter='blur(9px)'; ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,0.85)';
  ctx.beginPath(); ctx.ellipse(x,y+2,rx,rx*0.17,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawFigure(x,y,h,kind,ph,opt){
  const p=figurePath(x,y,h,kind,ph,opt||{});
  contactShadow(x,y,h*0.17,0.5);

  ctx.save();
  ctx.filter='blur(10px)'; ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=(opt&&opt.rim!==undefined?opt.rim:0.5);
  ctx.fillStyle='rgba(255,164,74,0.9)';
  ctx.translate(x,y); ctx.scale(1.05,1.045); ctx.translate(-x,-y);
  ctx.fill(p); ctx.restore();
  /* silhouette */
  ctx.save(); ctx.fillStyle=(opt&&opt.fill)||'rgba(6,5,9,0.985)'; ctx.fill(p); ctx.restore();
}
/* two people holding each other */
function drawEmbrace(x,y,h,ph,t){
  const sway=Math.sin(t*1.15)*h*0.005;
  const X=v=>x+v*h+sway, Y=v=>y+v*h;
  const wcx=-0.062, mcx=0.072;
  const parts=[
    /* her sari */
    ()=>{const p=new Path2D();
      p.moveTo(X(wcx-0.055),Y(-0.47));
      p.bezierCurveTo(X(wcx-0.085),Y(-0.30),X(wcx-0.115),Y(-0.12),X(wcx-0.125),Y(-0.005));
      p.bezierCurveTo(X(wcx-0.05),Y(0.020),X(wcx+0.05),Y(0.020),X(wcx+0.125),Y(-0.005));
      p.bezierCurveTo(X(wcx+0.115),Y(-0.12),X(wcx+0.085),Y(-0.30),X(wcx+0.055),Y(-0.47));
      p.closePath(); return p;},
    /* her torso */
    ()=>{const p=new Path2D();
      p.moveTo(X(wcx-0.072),Y(-0.775));
      p.bezierCurveTo(X(wcx-0.080),Y(-0.66),X(wcx-0.066),Y(-0.56),X(wcx-0.058),Y(-0.45));
      p.lineTo(X(wcx+0.058),Y(-0.45));
      p.bezierCurveTo(X(wcx+0.066),Y(-0.56),X(wcx+0.080),Y(-0.66),X(wcx+0.072),Y(-0.775));
      p.closePath(); return p;},
    /* her head, resting toward him */
    ()=>{const p=new Path2D();
      p.ellipse(X(wcx+0.012),Y(-0.838),h*0.050,h*0.056,0.22,0,Math.PI*2);
      p.moveTo(X(wcx-0.040),Y(-0.828));
      p.ellipse(X(wcx-0.046),Y(-0.826),h*0.030,h*0.030,0,0,Math.PI*2);
      return p;},
    /* her pallu */
    ()=>{const p=new Path2D();
      const w=0.030+0.007*Math.sin(t*1.6);
      p.moveTo(X(wcx-0.070),Y(-0.760));
      p.bezierCurveTo(X(wcx-0.125),Y(-0.60),X(wcx-0.152),Y(-0.40),X(wcx-0.140-w*0.5),Y(-0.15));
      p.lineTo(X(wcx-0.098-w*0.5),Y(-0.145));
      p.bezierCurveTo(X(wcx-0.104),Y(-0.40),X(wcx-0.086),Y(-0.60),X(wcx-0.040),Y(-0.745));
      p.closePath(); return p;},
    /* his legs */
    ()=>{const p=new Path2D();
      for(const sd of [-1,1]){
        p.moveTo(X(mcx+sd*0.050-0.030),Y(-0.47));
        p.lineTo(X(mcx+sd*0.050+0.030),Y(-0.47));
        p.lineTo(X(mcx+sd*0.058+0.026),Y(-0.004));
        p.lineTo(X(mcx+sd*0.058-0.026),Y(-0.004));
        p.closePath();
      }
      return p;},
    /* his torso */
    ()=>{const p=new Path2D();
      p.moveTo(X(mcx-0.084),Y(-0.795));
      p.bezierCurveTo(X(mcx-0.090),Y(-0.68),X(mcx-0.072),Y(-0.56),X(mcx-0.066),Y(-0.44));
      p.lineTo(X(mcx+0.066),Y(-0.44));
      p.bezierCurveTo(X(mcx+0.072),Y(-0.56),X(mcx+0.090),Y(-0.68),X(mcx+0.084),Y(-0.795));
      p.closePath(); return p;},
    /* his head, leaning to hers */
    ()=>{const p=new Path2D();
      p.ellipse(X(mcx-0.014),Y(-0.880),h*0.053,h*0.059,-0.18,0,Math.PI*2); return p;},
    /* his arm around her shoulders */
    ()=>{const p=new Path2D();
      p.moveTo(X(mcx-0.080),Y(-0.778));
      p.bezierCurveTo(X(-0.010),Y(-0.804),X(wcx-0.020),Y(-0.792),X(wcx-0.072),Y(-0.742));
      p.lineTo(X(wcx-0.076),Y(-0.686));
      p.bezierCurveTo(X(wcx-0.012),Y(-0.736),X(0.000),Y(-0.744),X(mcx-0.076),Y(-0.720));
      p.closePath(); return p;},
    /* her arm around his waist */
    ()=>{const p=new Path2D();
      p.moveTo(X(wcx+0.060),Y(-0.702));
      p.bezierCurveTo(X(0.010),Y(-0.652),X(mcx-0.012),Y(-0.602),X(mcx+0.058),Y(-0.582));
      p.lineTo(X(mcx+0.056),Y(-0.528));
      p.bezierCurveTo(X(mcx-0.022),Y(-0.552),X(0.008),Y(-0.600),X(wcx+0.058),Y(-0.652));
      p.closePath(); return p;}
  ];
  contactShadow(x,y,h*0.28,0.55);
  ctx.save(); ctx.filter='blur(11px)'; ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.55; ctx.fillStyle='rgba(255,164,74,0.9)';
  ctx.translate(x,y); ctx.scale(1.05,1.04); ctx.translate(-x,-y);
  for(const f of parts) ctx.fill(f());
  ctx.restore();
  ctx.save(); ctx.fillStyle='#06050a';
  for(const f of parts) ctx.fill(f());
  ctx.restore();
}

}

/* ================= TYPOGRAPHY ================= */

/* set the font, shrinking it if the line would overrun its column */
function fitFont(spec,txt,weight,fam,style){
  const f=q=>`${style?style+' ':''}${weight} ${q}px ${fam}`;
  let px=spec.px; ctx.font=f(px);
  const w=ctx.measureText(txt).width;
  if(spec.max&&w>spec.max){ px=px*spec.max/w; ctx.font=f(px); }
  return px;
}
const LINES=[
  {t0:1.35,t1:4.35,hi:'कुछ घर दीवाली पर भी अंधेरे रहते हैं…',en:'Some houses stay dark, even on Diwali…'},
  {t0:4.70,t1:7.00,hi:'जब तक सब लौट कर नहीं आते।',en:'Until everyone is home.'},
  {t0:8.70,t1:11.55,hi:'माँ हर साल एक दीया ज़्यादा जलाती है।',en:'Every year, she lights one extra diya.'},
  {t0:11.90,t1:14.40,hi:'उनके लिए, जो अब दूर रहते हैं।',en:'For the ones who live far away now.'},
  {t0:15.90,t1:18.90,hi:'और वही एक दीया, पूरे घर को रोशन कर देता है।',en:'And that one small flame lights the whole house.'},
  {t0:19.25,t1:21.90,hi:'रोशनी को रास्ता याद रहता है।',en:'Light always remembers the way back.'},
  {t0:24.30,t1:26.90,hi:'कोई दरवाज़े पर लौट आता है…',en:'Someone comes back to the door…'},
  {t0:27.20,t1:30.20,hi:'और घर फिर पूरा हो जाता है।',en:'and the house is whole again.'}
];
function drawSubtitles(t){
  let amax=0; const act=[];
  for(const l of LINES){const a=win(t,l.t0,l.t1,0.55,0.55); if(a>0.004){act.push([l,a]); amax=Math.max(amax,a);} }
  if(!act.length)return;
  /* scrim so the words stay readable */
  const sg=ctx.createLinearGradient(0,LAY.scrim,0,VH);
  sg.addColorStop(0,'rgba(4,3,6,0)'); sg.addColorStop(0.42,`rgba(4,3,6,${0.46*amax})`);
  sg.addColorStop(0.75,`rgba(3,2,5,${0.74*amax})`); sg.addColorStop(1,`rgba(3,2,5,${0.80*amax})`);
  ctx.fillStyle=sg; ctx.fillRect(0,LAY.scrim,VW,VH-LAY.scrim);
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  for(const [l,a] of act){
    const dy=(1-a)*12;
    ctx.shadowColor='rgba(0,0,0,0.95)'; ctx.shadowBlur=24;
    ctx.globalAlpha=a; ctx.letterSpacing='0px';
    fitFont(LAY.subHi,l.hi,600,'NSD, serif'); ctx.fillStyle='rgba(255,238,212,0.97)';
    ctx.fillText(l.hi,VW/2,LAY.subHi.y+dy);
    ctx.globalAlpha=a*0.80; ctx.letterSpacing='1.6px';
    fitFont(LAY.subEn,l.en,400,'Corm, serif','italic'); ctx.fillStyle='rgba(248,228,198,0.95)';
    ctx.fillText(l.en,VW/2,LAY.subEn.y+dy);
  }
  ctx.restore();
}
function goldGrad(y0,y1){
  const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#FFF3D2'); g.addColorStop(0.34,'#F6D98B');
  g.addColorStop(0.68,'#D9A63F'); g.addColorStop(1,'#B07A12');
  return g;
}
function drawFinaleText(t){
  /* a soft veil so the end card reads over the scene */
  const vA=win(t,30.9,39.8,1.3,0.7);
  if(vA>0.004){
    ctx.fillStyle=`rgba(7,4,12,${0.26*vA})`; ctx.fillRect(0,0,VW,VH);
    const vg=ctx.createRadialGradient(VW/2,VH*0.50,140,VW/2,VH*0.50,Math.hypot(VW,VH)*0.44);
    vg.addColorStop(0,`rgba(6,3,10,${0.30*vA})`); vg.addColorStop(1,'rgba(6,3,10,0)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  }
  ctx.save(); ctx.textAlign='center';
  /* शुभ दीपावली */
  const a1=win(t,31.2,39.5,0.95,0.55);
  if(a1>0.004){
    const y=LAY.title.y, sc=lerp(1.035,1,eOut((t-31.2)/1.8));
    ctx.save(); ctx.globalAlpha=a1; ctx.letterSpacing='0px';
    ctx.translate(VW/2,y); ctx.scale(sc,sc); ctx.translate(-VW/2,-y);
    glow(VW/2,y-LAY.title.px*0.29,LAY.glowR,0.30*a1,GLOW_WARM);
    const tpx=fitFont(LAY.title,'शुभ दीपावली',400,'Tiro, serif');
    ctx.shadowColor='rgba(90,34,0,0.55)'; ctx.shadowBlur=36; ctx.shadowOffsetY=5;
    ctx.fillStyle=goldGrad(y-tpx*0.82,y+tpx*0.17);
    ctx.fillText('शुभ दीपावली',VW/2,y);
    ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    /* a highlight sweeping across the gold */
    const sp=(t-32.2)/1.9;
    if(sp>0&&sp<1){
      const cx=lerp(VW*0.14,VW*0.86,sp), bw=VW*0.18;
      const sg=ctx.createLinearGradient(cx-bw,0,cx+bw,0);
      sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.5,'rgba(255,252,236,0.52)');
      sg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=sg;
      ctx.globalAlpha=a1*Math.sin(sp*Math.PI);
      ctx.fillText('शुभ दीपावली',VW/2,y); ctx.restore();
    }
    ctx.restore();
  }
  /* Happy Diwali */
  const a2=win(t,32.5,39.5,0.9,0.55);
  if(a2>0.004){
    ctx.globalAlpha=a2; ctx.letterSpacing=LAY.happy.ls+'px';
    fitFont(LAY.happy,'HAPPY DIWALI',600,'Corm, serif');
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=20;
    ctx.fillStyle='rgba(253,244,227,0.96)';
    ctx.fillText('HAPPY DIWALI',VW/2+LAY.happy.ls/2,LAY.happy.y);
    ctx.shadowBlur=0; ctx.letterSpacing='0px';
  }
  /* the wish */
  const a3=win(t,33.9,39.5,0.85,0.55);
  if(a3>0.004){
    ctx.globalAlpha=a3;
    ctx.letterSpacing='0px';
    fitFont(LAY.wishHi,'आपके घर में रोशनी, हँसी और अपनापन बना रहे।',400,'NSD, serif');
    ctx.fillStyle='rgba(255,236,206,0.93)';
    ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=16;
    ctx.fillText('आपके घर में रोशनी, हँसी और अपनापन बना रहे।',VW/2,LAY.wishHi.y);
    ctx.globalAlpha=a3*0.86; ctx.letterSpacing='1.8px';
    fitFont(LAY.wishEn,'May your light always find its way home.',400,'Corm, serif','italic');
    ctx.fillStyle='rgba(246,226,196,0.92)';
    ctx.fillText('May your light always find its way home.',VW/2,LAY.wishEn.y);
    ctx.letterSpacing='0px'; ctx.shadowBlur=0;
  }
  /* sign-off */
  const a4=win(t,36.2,39.5,0.9,0.55);
  if(a4>0.004){
    ctx.globalAlpha=a4*0.95;
    ctx.letterSpacing=LAY.signA.ls+'px';
    fitFont(LAY.signA,'THE MERAKI EVENT',600,'Corm, serif');
    ctx.fillStyle='rgba(246,217,139,0.95)';
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=14;
    ctx.fillText('THE MERAKI EVENT',VW/2+LAY.signA.ls/2,LAY.signA.y);
    ctx.letterSpacing=LAY.signB.ls+'px'; ctx.font=`italic ${LAY.signB.px}px Corm, serif`;
    ctx.globalAlpha=a4*0.68; ctx.fillStyle='rgba(240,222,198,0.9)';
    ctx.fillText('themerakievent.in',VW/2+LAY.signB.ls/2,LAY.signB.y);
    ctx.shadowBlur=0; ctx.letterSpacing='0px';
    /* thin rules */
    ctx.globalAlpha=a4*0.5; ctx.strokeStyle='rgba(246,217,139,0.8)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(VW/2-LAY.rule.outer,LAY.rule.y); ctx.lineTo(VW/2-LAY.rule.inner,LAY.rule.y);
    ctx.moveTo(VW/2+LAY.rule.inner,LAY.rule.y); ctx.lineTo(VW/2+LAY.rule.outer,LAY.rule.y);
    ctx.stroke();
  }
  ctx.restore();
}

/* ================= post ================= */
function post(t){
  /* vignette */
  const vr=Math.max(VW,VH);
  const v=ctx.createRadialGradient(VW*0.5,VH*0.47,vr*0.34,VW*0.5,VH*0.5,vr*1.02);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(0.62,'rgba(0,0,0,0.22)');
  v.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle=v; ctx.fillRect(0,0,VW,VH);
  /* warm grade */
  ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.09;
  ctx.fillStyle='#ff8a2a'; ctx.fillRect(0,0,VW,VH); ctx.restore();
  /* grain */
  ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.055;
  const gi=((t*30)|0)%GRAIN.length;
  ctx.drawImage(GRAIN[gi],0,0,VW,VH); ctx.restore();
  /* opening / closing fades */
  let black=0;
  black=Math.max(black,1-smooth(t/1.5));
  black=Math.max(black,smooth((t-38.9)/1.1));
  /* a soft blink between scenes */
  for(const c of [6.60,14.20,21.80,30.20]){
    const d=Math.abs(t-c);
    if(d<0.46) black=Math.max(black,0.70*Math.pow(Math.cos(d/0.46*Math.PI/2),1.4));
  }
  if(black>0.002){ ctx.fillStyle=`rgba(0,0,0,${clamp(black)})`; ctx.fillRect(0,0,VW,VH); }
}

/* ================= main ================= */
function renderFrame(t){
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
  ctx.fillStyle='#000'; ctx.fillRect(0,0,VW,VH);
  const order=[['wait',sceneWait],['diya',null],['spread',sceneSpread],['home',sceneHome],['wish',sceneWish]];
  for(const [name,fn] of order){
    const a=sceneAlpha(t,SC[name]);
    if(a<=0.004)continue;
    ctx.save(); ctx.globalAlpha=a;
    if(name==='diya') drawScene2(t,t-SC.diya[0]); else fn(t);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  drawSubtitles(t);
  drawFinaleText(t);
  post(t);
}
window.renderFrame=renderFrame;
