<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dhansiri Rani Associates — Letterpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
@page{size:A4;margin:0}
:root{--navy:#12294d;--gold:#c49a2c;--gold2:#e2c063;--ink:#2b3440}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{width:210mm;height:297mm;position:relative;overflow:hidden;font-family:Inter,'Liberation Sans',sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* top band */
.band{position:absolute;top:0;left:0;right:0;height:3.2mm;background:var(--navy)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:-1mm;height:1mm;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}

/* header */
.head{position:absolute;top:13mm;left:16mm;right:16mm;display:flex;align-items:center;gap:7mm}
.seal{width:33mm;height:33mm;flex:none;filter:drop-shadow(0 .6mm .8mm rgba(18,41,77,.25))}
.name{font-family:Cinzel,serif;font-weight:700;color:var(--navy);font-size:25pt;letter-spacing:.9mm;line-height:1;white-space:nowrap}
.name b{color:var(--gold);font-weight:700}
.orn{display:flex;align-items:center;gap:2.5mm;margin:3mm 0 2.6mm}
.orn i{height:.35mm;flex:1;background:linear-gradient(90deg,var(--gold),transparent)}
.orn i:first-child{flex:none;width:10mm;background:var(--gold)}
.orn span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12.5pt;color:var(--navy);letter-spacing:.2mm;white-space:nowrap}
.contact{display:flex;flex-wrap:wrap;gap:1.6mm 7mm;font-size:9.4pt;color:var(--ink)}
.contact div{display:flex;align-items:center;gap:1.8mm}
.contact svg{width:3.6mm;height:3.6mm;fill:var(--gold);flex:none}
.contact strong{font-weight:600;color:var(--navy);letter-spacing:.2mm}

.rule{position:absolute;top:53mm;left:16mm;right:16mm;height:.8mm;border-top:.45mm solid var(--navy);border-bottom:.2mm solid var(--gold)}

.meta{position:absolute;top:60mm;left:16mm;right:16mm;display:flex;justify-content:space-between;font-size:9.5pt;color:var(--navy);font-weight:500}
.meta span{display:inline-block;border-bottom:.25mm dotted #8a93a0;margin-left:2mm;vertical-align:bottom}

/* watermark */
.wm{position:absolute;top:100mm;left:50%;width:115mm;margin-left:-57.5mm;opacity:.045}

/* footer */
.foot{position:absolute;bottom:0;left:0;right:0;height:26mm}
.foot svg{position:absolute;inset:0;width:100%;height:100%}
.ftext{position:absolute;left:16mm;right:16mm;bottom:5.2mm;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:8.6pt;letter-spacing:.15mm}
.ftext .fn{font-family:Cinzel,serif;font-weight:600;letter-spacing:.6mm;font-size:9.4pt;color:var(--gold2)}
.ftext .dot{color:var(--gold2);margin:0 2mm}
</style></head><body>
<div class="band"></div>
<header class="head">
  <div class="seal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" >
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;display=block');
      .arc{font-family:Cinzel,'Liberation Serif',serif;font-weight:700;fill:#d9b44a}
      .mono{font-family:Cinzel,'Liberation Serif',serif;font-weight:700;fill:#fff}</style>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d27a"/><stop offset=".5" stop-color="#c9a13b"/><stop offset="1" stop-color="#a77e22"/>
    </linearGradient>
    <radialGradient id="navy" cx=".5" cy=".4" r=".65">
      <stop offset="0" stop-color="#1d3d6e"/><stop offset="1" stop-color="#0e2142"/>
    </radialGradient>
    <path id="top" d="M24,100 A76,76 0 0 1 176,100"/>
    <path id="bot" d="M14,100 A86,86 0 0 0 186,100"/>
  </defs>
  <!-- seal -->
  <circle cx="100" cy="100" r="98" fill="url(#gold)"/>
  <circle cx="100" cy="100" r="94.5" fill="url(#navy)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#gold)" stroke-width=".7"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <circle cx="100" cy="100" r="64.5" fill="none" stroke="url(#gold)" stroke-width=".6"/>
  <!-- ring text -->
  <text class="arc" font-size="12.2" letter-spacing="1.1"><textPath href="#top" startOffset="50%" text-anchor="middle">DHANSIRI RANI ASSOCIATES</textPath></text>
  <text class="arc" font-size="10.5" letter-spacing="3"><textPath href="#bot" startOffset="50%" text-anchor="middle">GOLAGHAT · ASSAM</textPath></text>
  <path d="M19,100 l4,-4 l4,4 l-4,4z M173,100 l4,-4 l4,4 l-4,4z" fill="url(#gold)"/>
  <!-- crown -->
  <g fill="url(#gold)">
    <path d="M76,77 L80,58 L90,68 L100,52 L110,68 L120,58 L124,77 Z"/>
    <circle cx="80" cy="56.5" r="2.6"/><circle cx="100" cy="50.5" r="2.8"/><circle cx="120" cy="56.5" r="2.6"/>
    <rect x="75" y="79" width="50" height="4.2" rx="1"/>
  </g>
  <!-- monogram -->
  <text class="mono" x="100" y="122" text-anchor="middle" font-size="36" letter-spacing="1">DR</text>
  <!-- river -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M66,135 q8.5,-7 17,0 t17,0 t17,0 t17,0" stroke-width="2.6"/>
    <path d="M74,145 q6.5,-5.5 13,0 t13,0 t13,0 t13,0" stroke-width="1.7"/>
  </g>
</svg>
</div>
  <div>
    <div class="name">Dhansiri <b>Rani</b> Associates</div>
    <div class="orn"><i></i><span>Golaghat, Assam</span><i></i></div>
    <div class="contact">
      <div><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Kumarpatty, Near 2 No. Railway Gate, Ward No. 2, Golaghat</div>
      <div><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><strong>+91 92827 71726</strong></div>
    </div>
  </div>
</header>
<div class="rule"></div>
<div class="meta"><div>Ref. No.<span style="width:52mm"></span></div><div>Date<span style="width:38mm"></span></div></div>
<div class="wm"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#12294d"><circle cx="100" cy="100" r="96" stroke-width="3"/><circle cx="100" cy="100" r="68" stroke-width="1.5"/></g>
<g fill="#12294d"><path d="M76,77 L80,58 L90,68 L100,52 L110,68 L120,58 L124,77 Z"/><rect x="75" y="79" width="50" height="4.2"/></g>
<text x="100" y="122" text-anchor="middle" font-family="Cinzel,serif" font-weight="700" font-size="36" fill="#12294d">DR</text>
<g fill="none" stroke="#12294d" stroke-linecap="round"><path d="M66,135 q8.5,-7 17,0 t17,0 t17,0 t17,0" stroke-width="2.6"/><path d="M74,145 q6.5,-5.5 13,0 t13,0 t13,0 t13,0" stroke-width="1.7"/></g></svg></div>
<footer class="foot">
  <svg viewBox="0 0 2100 260" preserveAspectRatio="none">
    <path d="M0,70 C350,10 700,10 1050,60 S1750,120 2100,50 L2100,260 L0,260Z" fill="#12294d"/>
    <path d="M0,52 C350,-8 700,-8 1050,42 S1750,102 2100,32" fill="none" stroke="#c49a2c" stroke-width="6"/>
    <path d="M0,88 C350,28 700,28 1050,78 S1750,138 2100,68" fill="none" stroke="#c49a2c" stroke-width="2" opacity=".55"/>
  </svg>
  <div class="ftext"><span class="fn">Dhansiri Rani Associates</span><span>Kumarpatty, Ward No. 2, Golaghat, Assam<span class="dot">◆</span>+91 92827 71726</span></div>
</footer>
</body></html>
