<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meraki</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#A3192A">
<meta name="apple-mobile-web-app-title" content="Meraki">
<script>
  // Opened from the home-screen icon: go straight to the dashboard.
  var DASHBOARD = "https://claude.ai/artifact/KBSWrfUQ5ZQ77Xeahyehq9";
  if (/[?&]launch=1/.test(location.search)) location.replace(DASHBOARD);
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600&display=swap">
<style>
  body { margin: 0; min-height: 100vh; background: #A3192A; color: #FBEFD9; font-family: "Figtree", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
  main { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  h1 { font-family: "Marcellus", Georgia, serif; font-weight: 400; font-size: 2rem; margin: 0; }
  a.btn { background: #E2B75C; color: #4A0A13; text-decoration: none; font-weight: 600; padding: 14px 26px; border-radius: 10px; }
  ol { text-align: left; margin: 0; padding-left: 20px; line-height: 1.6; font-size: .95rem; }
  .card { background: rgba(0,0,0,.18); border-radius: 12px; padding: 16px 18px; }
  .card b { color: #E2B75C; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="Meraki icon">
  <h1>Meraki Growth Hub</h1>
  <a class="btn" href="https://claude.ai/artifact/KBSWrfUQ5ZQ77Xeahyehq9">Open today's tasks</a>
  <div class="card">
    <p style="margin:0 0 8px"><b>Put Meraki on your home screen</b></p>
    <ol>
      <li><b>iPhone (Safari):</b> tap Share, then <b>Add to Home Screen</b>.</li>
      <li><b>Android (Chrome):</b> tap ⋮, then <b>Add to Home screen</b>, then <b>Add</b>.</li>
      <li>Tap the new Meraki icon any time to open your dashboard.</li>
    </ol>
  </div>
</main>
</body>
</html>
