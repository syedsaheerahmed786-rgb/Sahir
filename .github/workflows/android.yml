name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional: add these repository secrets to sign with your own key, so
      # every new APK installs as an update over the last one:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK and App Bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/meraki-insiders.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/meraki-insiders.aab

      - uses: actions/upload-artifact@v4
        with:
          name: meraki-insiders
          path: dist/

      # A fixed download link for the newest build:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/meraki-insiders.apk
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Meraki Insiders Android app" \
              --notes "Latest build of the Meraki Insiders app. Download meraki-insiders.apk on your phone and open it to install." \
              --target "$GITHUB_SHA"
          gh release upload android-latest dist/meraki-insiders.apk dist/meraki-insiders.aab --clobber
