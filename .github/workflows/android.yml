name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional: add these repository secrets to sign with your own key, so
      # every new APK installs as an update over the last one:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK and App Bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/meraki-insiders.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/meraki-insiders.aab

      - uses: actions/upload-artifact@v4
        with:
          name: meraki-insiders
          path: dist/

      # A fixed download link for the newest build:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/meraki-insiders.apk
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Meraki Insiders Android app" \
              --notes "Latest build of the Meraki Insiders app. Download meraki-insiders.apk on your phone and open it to install." \
              --target "$GITHUB_SHA"
          gh release upload android-latest dist/meraki-insiders.apk dist/meraki-insiders.aab --clobber

  # Installs the APK on an emulator, opens it, and fails if the app crashes.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meraki-insiders

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r meraki-insiders.apk
            adb logcat -c
            adb shell am start -W -n in.themerakievent.insiders/.MainActivity
            sleep 20
            adb exec-out screencap -p > screen.png
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d | grep -iE "AndroidRuntime|merakievent|chromium" | tail -200 > logcat.txt || true
            cat crash.txt
            adb shell pidof in.themerakievent.insiders || (echo "App is not running: it crashed" && exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            screen.png
            crash.txt
            logcat.txt
